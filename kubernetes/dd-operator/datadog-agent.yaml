kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
  annotations:
    agent.datadoghq.com/appsec.injector.enabled: "true"
spec:
  global:
    clusterName: "my_k8s_cluster"
    site: "datadoghq.eu"
    tags:
      - "env:production"
    credentials:
      apiSecret:
        secretName: "dd-secrets"
        keyName: "api-key"
    kubelet:
      tlsVerify: false
  features:
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
    admissionController:
      enabled: true
      mutateUnlabelled: true
    apm:
      instrumentation:
        enabled: true
        targets:
          - name: "default-target"
            namespaceSelector:
              matchNames:
                - "astronomy-store"
            ddTraceVersions:
              java: "1"
              python: "4"
              js: "5"
              php: "1"
              dotnet: "3"
              ruby: "2"
            # ddTraceConfigs:
              # Datadog Dynamic Instrumentation (DDI). See https://docs.datadoghq.com/tracing/dd_instrumentation/ .
              # - name: "DD_DYNAMIC_INSTRUMENTATION_ENABLED"
              #   value: "true"
              # Datadog DBM (Database Monitoring). See https://docs.datadoghq.com/database_monitoring/ .
              # - name: "DD_DBM_PROPAGATION_MODE" # full, service, disabled
              #   value: "full"
              # - name: "DD_DBM_TRACE_PREPARED_STATEMENTS"
              #   value: "true"
              # Datadog DSM (Data Streams Monitoring). See https://docs.datadoghq.com/data_streams/ .
              # - name: "DD_DATA_STREAMS_ENABLED"
              #   value: "true"
              # - name: "DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED"
              #   value: "true"
              # Datadog App & API Protection: threat detection and blocking.
              # See https://docs.datadoghq.com/security/application_security/ .
              # - name: DD_APPSEC_ENABLED
              #   value: "true"
              # Datadog Code Security IAST (Interactive Application Security Testing): detects code-level
              # vulnerabilities (SQL injection, SSRF...) in the running service.
              # See https://docs.datadoghq.com/security/code_security/iast/ .
              # - name: DD_IAST_ENABLED
              #   value: "true"
              # Datadog Code Security SCA (Software Composition Analysis): detects vulnerable open source
              # libraries loaded at runtime.
              # See https://docs.datadoghq.com/security/code_security/software_composition_analysis/ .
              # - name: DD_APPSEC_SCA_ENABLED
              #   value: "true"
    logCollection:
      enabled: true
      containerCollectAll: true
    asm:
      threats:
        enabled: true
      sca:
        enabled: true
      iast:
        enabled: true
    usm:
      enabled: true
    liveProcessCollection:
      enabled: true
    otlp:
      receiver:
        protocols:
          grpc:
            enabled: true
          http:
            enabled: true
  override:
    nodeAgent:
      # No tolerations: the node agent only runs on untainted nodes. See README.md#node-agent-tolerations
      containers:
        agent:
          env:
            - name: DD_OTLP_CONFIG_LOGS_ENABLED
              value: "true"