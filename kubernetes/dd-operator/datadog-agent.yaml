kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
  annotations:
    agent.datadoghq.com/appsec.injector.enabled: "true"
spec:
  global:
    clusterName: "my_k8s_cluster"
    site: "datadoghq.eu"
    tags:
      - "env:production"
    credentials:
      apiSecret:
        secretName: "dd-secrets"
        keyName: "api-key"
    kubelet:
      tlsVerify: false
  features:
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
    admissionController:
      enabled: true
      mutateUnlabelled: true
    apm:
      instrumentation:
        enabled: true
        targets:
          - name: "default-target" # DATADOG NATIVE MODE
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    # use the OpenTelemetry mode (`otel-mode-target`) to instrument the following k8s namespaces:
                    - "ecommerce"
                    - "astronomy-store"
            ddTraceVersions:
              java: "1"
              python: "4"
              js: "5"
              php: "1"
              dotnet: "3"
              ruby: "2"
            ddTraceConfigs:
              - name: "DD_PROFILING_ENABLED"
                value: "auto"
              - name: "DD_TRACE_DEBUG"
                value: "false"
          - name: "otel-mode-target" # OTEL NATIVE MODE
            namespaceSelector:
              matchNames:
                - "ecommerce"
                - "astronomy-store"
            ddTraceVersions:
              java: "1"
              python: "4"
              js: "5"
              php: "1"
              dotnet: "3"
              ruby: "2"
            ddTraceConfigs:
              ## ACTIVATE OTEL MODE
              # DD_OTEL_SDK_ENABLED: Candidate new env var to enable OTel mode on DDOT SDKs, replacing all the previous ones,
              # but not yet supported by the DDOT SDKs
              # - name: "DD_OTEL_SDK_ENABLED"
              #  value: "true"
              - name: "DD_TRACE_OTEL_ENABLED"
                value: "true"
              - name: "DD_LOGS_OTEL_ENABLED"
                value: "true"
              - name: "DD_METRICS_OTEL_ENABLED"
                value: "true"
              - name: "DD_TRACE_OTEL_SEMANTICS_ENABLED"
                value: "true"
              - name: "OTEL_TRACES_EXPORTER"
                value: "otlp"

              - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
                value: "http://datadog-agent.datadog.svc.cluster.local:4318"
              ## WORKAROUND: DDOT SDK GO LANG ignores OTEL_EXPORTER_OTLP_ENDPOINT, it's a bug
              ## https://github.com/DataDog/dd-trace-go/pull/5407
              - name: "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT"
                value: "http://datadog-agent.datadog.svc.cluster.local:4318"

              ## DISABLE PROFILING
              - name: "DD_PROFILING_ENABLED"
                value: "false"
              ## DBM SUPPORT
              - name: "DD_DBM_PROPAGATION_MODE"
                value: "full"
              - name: "DD_DBM_TRACE_PREPARED_STATEMENTS"
                value: "true"
              # DSM SUPPORT
              - name: "DD_DATA_STREAMS_ENABLED"
                value: "true"
              - name: "DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED"
                value: "true"
    logCollection:
      enabled: true
      containerCollectAll: true
    asm:
      threats:
        enabled: true
      sca:
        enabled: true
      iast:
        enabled: true
    usm:
      enabled: true
    liveProcessCollection:
      enabled: true
    otelCollector:
      enabled: true
      ports:
        - containerPort: 4317
          hostPort: 4317
          name: otel-grpc
        - containerPort: 4318
          hostPort: 4318
          name: otel-http
      conf:
        configData: |-
          receivers:
            prometheus:
              config:
                scrape_configs:
                  - job_name: "otelcol"
                    scrape_interval: 10s
                    static_configs:
                      - targets:
                          - 0.0.0.0:8888
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          exporters:
            datadog:
              api:
                key: ${env:DD_API_KEY}
                site: ${env:DD_SITE}
              sending_queue:
                batch:
                  flush_timeout: 10s
          processors:
            resource:
              attributes:
                - key: deployment.environment.name
                  value: "production"
                  action: upsert
            infraattributes:
              cardinality: 2
          connectors:
            datadog/connector:
              traces:
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [resource, infraattributes]
                exporters: [datadog, datadog/connector]
              metrics:
                receivers: [otlp, datadog/connector, prometheus]
                processors: [resource, infraattributes]
                exporters: [datadog]
              logs:
                receivers: [otlp]
                processors: [resource, infraattributes]
                exporters: [datadog]
  override:
    clusterAgent:
      image:
        # name: "registry.datadoghq.com/cluster-agent:latest"
        name: "registry.datadoghq.com/cluster-agent:7.83.2"
    nodeAgent:
      image:
        name: "registry.datadoghq.com/agent:7.83.2-full"
      tolerations:
        - key: "node-role.kubernetes.io/controlplane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/etcd"
          operator: "Exists"
          effect: "NoExecute"
