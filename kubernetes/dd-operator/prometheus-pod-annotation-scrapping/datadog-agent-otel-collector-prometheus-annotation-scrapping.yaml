# Evolution of https://docs.datadoghq.com/opentelemetry/setup/ddot_collector/install/kubernetes_daemonset?tab=datadogoperator#configure-the-opentelemetry-collector
kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
  annotations:
    agent.datadoghq.com/appsec.injector.enabled: "true"
spec:
  global:
    clusterName: "my-k8s-cluster"
    site: "datadoghq.eu"
    tags:
      - "env:production"
    credentials:
      apiSecret:
        secretName: "dd-secrets"
        keyName: "api-key"
    kubelet:
      tlsVerify: false
  features:
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
    admissionController:
      enabled: true
      mutateUnlabelled: true
    apm:
      instrumentation:
        enabled: true
        targets:
          - name: "default-target"
            namespaceSelector:
              matchNames:
                - "astronomy-store"
            ddTraceVersions:
              java: "1"
              python: "4"
              js: "5"
              php: "1"
              dotnet: "3"
              ruby: "2"
    logCollection:
      enabled: true
      containerCollectAll: true
    asm:
      threats:
        enabled: true
      sca:
        enabled: true
      iast:
        enabled: true
    usm:
      enabled: true
    liveProcessCollection:
      enabled: true
    otelCollector:
      enabled: true
      ports:
        - containerPort: 4317
          hostPort: 4317
          name: otel-grpc
        - containerPort: 4318
          hostPort: 4318
          name: otel-http
      conf:
        configData: |-
          # fork of https://docs.datadoghq.com/opentelemetry/setup/ddot_collector/install/kubernetes_daemonset?tab=datadogoperator#configure-the-opentelemetry-collector
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            prometheus:
              config:
                scrape_configs:
                  - job_name: "otelcol"
                    scrape_interval: 10s
                    static_configs:
                      - targets:
                          - 0.0.0.0:8888
            # extract from https://github.com/open-telemetry/opentelemetry-helm-charts/blob/opentelemetry-kube-stack-0.27.0/charts/opentelemetry-kube-stack/examples/daemonset-prometheus-presets/rendered/collector.yaml#L100-L162
            prometheus/pod_annotations:
              config:
                scrape_configs:
                  - job_name: kubernetes-pods
                    kubernetes_sd_configs:
                      - role: pod
                        selectors:
                          - field: spec.nodeName=${env:OTEL_K8S_NODE_NAME}
                            label: app.kubernetes.io/component!=opentelemetry-collector
                            role: pod
                    relabel_configs:
                      - action: keep
                        regex: true
                        source_labels:
                          - __meta_kubernetes_pod_annotation_prometheus_io_scrape
                      - action: drop
                        regex: true
                        source_labels:
                          - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
                      - action: replace
                        regex: (https?)
                        source_labels:
                          - __meta_kubernetes_pod_annotation_prometheus_io_scheme
                        target_label: __scheme__
                      - action: replace
                        regex: (.+)
                        source_labels:
                          - __meta_kubernetes_pod_annotation_prometheus_io_path
                        target_label: __metrics_path__
                      - action: replace
                        regex: ([^:]+)(?::\d+)?;(\d+)
                        replacement: $$1:$$2
                        source_labels:
                          - __address__
                          - __meta_kubernetes_pod_annotation_prometheus_io_port
                        target_label: __address__
                      - action: labelmap
                        regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
                        replacement: __param_$$1
                      - action: labelmap
                        regex: __meta_kubernetes_pod_label_(.+)
                      - action: replace
                        source_labels:
                          - __meta_kubernetes_namespace
                        target_label: namespace
                      - action: replace
                        source_labels:
                          - __meta_kubernetes_pod_name
                        target_label: pod
                      - action: replace
                        source_labels:
                          - __meta_kubernetes_pod_node_name
                        target_label: node
                      - action: drop
                        regex: Pending|Succeeded|Failed|Completed
                        source_labels:
                          - __meta_kubernetes_pod_phase
                      - action: replace
                        source_labels:
                          - __meta_kubernetes_pod_label_app_kubernetes_io_name
                        target_label: job
                    scrape_interval: 30s
                    scrape_timeout: 10s
          exporters:
            debug:
              verbosity: detailed
            datadog:
              api:
                key: ${env:DD_API_KEY}
                site: ${env:DD_SITE}
              sending_queue:
                batch:
                  flush_timeout: 10s
          processors:
            infraattributes:
              cardinality: 2
            cumulativetodelta:
          connectors:
            datadog/connector:
              traces:
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [infraattributes]
                exporters: [debug, datadog, datadog/connector]
              metrics:
                receivers: [otlp, datadog/connector, prometheus, prometheus/pod_annotations]
                processors: [infraattributes, cumulativetodelta]
                exporters: [debug, datadog]
              logs:
                receivers: [otlp]
                processors: [infraattributes]
                exporters: [debug, datadog]
  override:
    nodeAgent:
      # No tolerations: the node agent only runs on untainted nodes. See ../README.md#node-agent-tolerations
      containers:
        otel-agent:
          env:
            # Used by the `prometheus/pod_annotations` receiver to only scrape pods on the local node
            - name: OTEL_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
